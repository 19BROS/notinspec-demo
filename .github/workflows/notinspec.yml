# NOT-IN-SPEC on the hosted service (SPEC §11). This path is registered with the project,
# so the server accepts uploads only from this workflow.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed] # closed: drops the PR's candidate tests
  push:
    branches: [master] # master runs: the baseline for later PRs
  workflow_dispatch: # the first baseline run

concurrency:
  group: notinspec-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Sphinx XML, built without secrets or an OIDC token: sphinx-build runs project code (conf.py).
  # The Markdown docs and the single-file openapi.yaml need no build.
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v7
      - run: |
          python3 -m venv .venv && . .venv/bin/activate
          pip install -r sphinx/requirements.txt
          sphinx-build -b xml sphinx build/xml
          { sphinx-build --version; python --version; pip freeze; } > build/xml/build-env.txt
      - uses: actions/upload-artifact@v7
        with: { name: notinspec-inputs, path: build/ }

  upload:
    needs: build
    # also on closed, when build is skipped
    if: ${{ !cancelled() && (needs.build.result == 'success' || github.event.action == 'closed') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the OIDC token proves to the server which repo and workflow sent the docs
      pull-requests: write # the PR comment
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 2 } # the merge commit's first parent finds the baseline
      - if: github.event.action != 'closed'
        uses: actions/download-artifact@v7
        with: { name: notinspec-inputs, path: build/ }
      # pinned to a commit of not-in-spec main until @v0 moves to the thin client
      - uses: 19BROS/not-in-spec/action@05c372ff41667c7962c4467ff96d7f163e77a43c
